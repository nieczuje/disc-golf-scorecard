<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reagana DGC">
<meta name="theme-color" content="#16261a">
<title>Reagana DGC Scorecard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --forest-deep:#16261a;
    --forest:#22391f;
    --forest-mid:#375c34;
    --amber:#e0a63b;
    --amber-soft:#f0c878;
    --cream:#f4efdf;
    --cream-dim:#e7e0c9;
    --ink:#182016;
    --chalk:#fbf8ee;
    --under:#3f7d4a;
    --over:#b8503a;
    --even:#8a7a4a;
    --line: rgba(22,38,26,0.12);
    --radius: 14px;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%; height:100dvh; overscroll-behavior-y: none;}
  body{
    background: var(--forest-deep);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(224,166,59,0.10), transparent 55%),
      radial-gradient(circle at 100% 100%, rgba(55,92,52,0.35), transparent 60%);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    min-height:100%;
    display:flex;
    flex-direction:column;
    overscroll-behavior-y: none;
  }

  #app{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width:520px;
    margin:0 auto;
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    overscroll-behavior-y: none;
  }

  /* ---------- HEADER ---------- */
  header.top{
    padding:18px 18px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid rgba(240,200,120,0.15);
  }
  .logo-img{
    width:52px; height:52px;
    flex-shrink:0;
    display:block;
    filter: drop-shadow(0 3px 8px rgba(0,0,0,0.4));
  }
  header.top h1{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:16.5px;
    letter-spacing:0.02em;
    margin:0;
    line-height:1.25;
    color: var(--chalk);
  }
  header.top .sub{
    font-size:11.5px;
    color: var(--amber-soft);
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin-top:2px;
  }

  /* ---------- MAIN ---------- */
  main{
    flex:1;
    padding:18px 18px 100px;
    overflow-y:auto;
    overscroll-behavior-y: contain;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  main .screen{ flex-shrink:0; }
  main.map-mode{
    padding:0;
    overflow:hidden;
  }
  main.map-mode .screen.map-screen{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
  }

  .screen{ display:none; animation: fadeIn .25s ease; }
  .screen.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  /* ---------- CARD ---------- */
  .card{
    background: var(--cream);
    color: var(--ink);
    border-radius: var(--radius);
    padding:18px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.28);
  }

  h2.section-title{
    font-family:'Oswald', sans-serif;
    font-size:13px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color: var(--amber-soft);
    margin:0 0 12px;
    font-weight:600;
  }

  /* ---------- SETUP ---------- */
  .player-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:9px;
  }
  .player-row input{
    flex:1;
    border:none;
    border-bottom:2px solid var(--line);
    background:transparent;
    padding:9px 4px;
    font-size:15.5px;
    font-family:'Inter', sans-serif;
    font-weight:500;
    color: var(--ink);
    outline:none;
  }
  .player-row input:focus{ border-bottom-color: var(--forest-mid); }
  .player-row .rm{
    width:30px; height:30px;
    border-radius:50%;
    border:none;
    background: rgba(184,80,58,0.1);
    color: var(--over);
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
  }
  .add-player{
    width:100%;
    margin-top:6px;
    padding:11px;
    border-radius:10px;
    border:2px dashed var(--forest-mid);
    background:transparent;
    color: var(--forest);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .add-player:disabled{ opacity:0.35; }

  .btn-primary{
    width:100%;
    margin-top:18px;
    padding:15px;
    border-radius:12px;
    border:none;
    background: linear-gradient(160deg, var(--amber), #c9871f);
    color: var(--forest-deep);
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:15px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    cursor:pointer;
    box-shadow: 0 6px 16px rgba(224,166,59,0.28);
  }
  .btn-primary:disabled{ opacity:0.35; box-shadow:none; }

  .btn-ghost{
    width:100%;
    margin-top:10px;
    padding:13px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:transparent;
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  .btn-ghost.armed{
    border-color: var(--over);
    color: var(--over);
    background: rgba(184,80,58,0.08);
  }
  .btn-primary.armed{
    background: linear-gradient(160deg, var(--over), #8f3c29);
    color: var(--chalk);
    box-shadow: 0 6px 16px rgba(184,80,58,0.28);
  }

  .course-meta{
    display:flex;
    gap:14px;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .course-meta div{ flex:1; text-align:center; }
  .course-meta .num{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:19px;
    color: var(--forest);
  }
  .course-meta .lbl{
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#6b6650;
    margin-top:2px;
  }

  /* ---------- HOLE PLAY ---------- */
  .hole-hero{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .hole-hero .hole-num{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:52px;
    line-height:1;
    color: var(--forest);
  }
  .hole-hero .hole-num sup{
    font-size:15px;
    font-weight:600;
    vertical-align:super;
    color:#8a8468;
  }
  .hole-hero .hole-stats{ text-align:right; }
  .hole-hero .par-pill{
    display:inline-block;
    background: var(--forest);
    color: var(--chalk);
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:13px;
    padding:5px 11px;
    border-radius:20px;
    margin-bottom:6px;
  }
  .hole-hero .dist{
    font-size:12px;
    color:#6b6650;
    font-family:'JetBrains Mono', monospace;
  }

  .hole-progress{
    display:flex;
    gap:3px;
    margin-bottom:18px;
  }
  .hole-progress .tick{
    flex:1;
    height:4px;
    border-radius:2px;
    background: var(--line);
  }
  .hole-progress .tick.done{ background: var(--forest-mid); }
  .hole-progress .tick.current{ background: var(--amber); }

  .score-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 0;
    border-bottom:1px solid var(--line);
  }
  .score-row:last-child{ border-bottom:none; }
  .score-row .pname{
    flex:1;
    font-weight:600;
    font-size:15px;
    color: var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:0;
    background:#fff;
    border-radius:24px;
    border:1.5px solid var(--line);
    overflow:hidden;
  }
  .stepper button{
    width:34px; height:34px;
    border:none;
    background:transparent;
    font-size:17px;
    font-weight:700;
    color: var(--forest);
    cursor:pointer;
  }
  .stepper button:active{ background: rgba(34,57,31,0.08); }
  .stepper .val{
    min-width:32px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:16px;
    color: var(--ink);
  }

  .nav-row{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .nav-row button{
    flex:1;
    padding:14px;
    border-radius:12px;
    border:none;
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    cursor:pointer;
  }
  .nav-row .prev{
    background: transparent;
    border:1.5px solid var(--line);
    color: var(--ink);
    flex:0 0 90px;
  }
  .nav-row .next{
    background: linear-gradient(160deg, var(--forest-mid), var(--forest));
    color: var(--chalk);
  }
  .nav-row .finish{
    background: linear-gradient(160deg, var(--amber), #c9871f);
    color: var(--forest-deep);
  }

  .link-btn{
    display:block;
    width:100%;
    text-align:center;
    background:none;
    border:none;
    color: var(--amber-soft);
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:14px 0 4px;
    cursor:pointer;
  }

  /* ---------- FULL CARD TABLE ---------- */
  .table-wrap{ overflow-x:auto; margin-top:4px; -webkit-overflow-scrolling:touch;}
  table.full{
    border-collapse:collapse;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    width:100%;
  }
  table.full th, table.full td{
    padding:7px 6px;
    text-align:center;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  table.full th{
    font-weight:700;
    color:#6b6650;
    font-size:10.5px;
  }
  table.full td.pname{
    text-align:left;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:12.5px;
    color: var(--ink);
    position:sticky;
    left:0;
    background: var(--cream);
  }
  table.full td.par-row{ color:#8a8468; }
  table.full tr.par-tr td{ color:#8a8468; font-weight:700; }

  /* ---------- RESULTS ---------- */
  .podium{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:6px;
  }
  .place{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    border-radius:12px;
    background:#fff;
  }
  .place.first{
    background: linear-gradient(100deg, #fbe9c4, #f4efdf);
    border:1.5px solid var(--amber);
  }
  .place .rank{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:18px;
    color:#8a8468;
    width:22px;
  }
  .place.first .rank{ color: var(--amber); }
  .place .pname{
    flex:1;
    font-weight:700;
    font-size:15px;
    color: var(--ink);
  }
  .place .total{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:17px;
    color: var(--ink);
    margin-right:6px;
  }
  .place .topar{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:13px;
    padding:3px 9px;
    border-radius:20px;
  }
  .topar.under{ background: rgba(63,125,74,0.14); color: var(--under); }
  .topar.over{ background: rgba(184,80,58,0.14); color: var(--over); }
  .topar.even{ background: rgba(138,122,74,0.14); color: var(--even); }

  /* ---------- TABS (bottom nav) ---------- */
  nav.tabs{
    position:sticky;
    bottom:0;
    display:flex;
    background: rgba(22,38,26,0.96);
    backdrop-filter: blur(10px);
    border-top:1px solid rgba(240,200,120,0.15);
    padding-bottom: max(18px, env(safe-area-inset-bottom, 18px));
    flex-shrink:0;
  }
  nav.tabs button{
    flex:1;
    background:none;
    border:none;
    padding:14px 4px 6px;
    color:#8a967f;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:11.5px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
  }
  nav.tabs button .icn{ font-size:19px; }
  nav.tabs button.active{ color: var(--amber-soft); }

  /* ---------- MAP ---------- */
  .map-screen{ padding:0; }
  .map-wrap{
    flex:1;
    min-height:0;
    display:flex;
    overflow:auto;
    background: #000;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  .map-wrap img{
    display:block;
    height:100%;
    width:auto;
    max-width:none;
    flex-shrink:0;
  }
  .map-title{
    font-family:'Oswald', sans-serif;
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color: var(--amber-soft);
    margin:0;
    padding:14px 18px 10px;
    font-weight:600;
    flex-shrink:0;
  }

  ::-webkit-scrollbar{ height:6px; width:6px; }
  ::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.15); border-radius:3px; }
</style>
</head>

  // ---------- persistence ----------
  // Intentionally no persistent storage: keeping state in-memory only so this
  // app works for anyone with the link, with no Claude account required.
  function save(){}
  function load(){}

  // ---------- helpers ----------
  function defaultScoresForHole(){
    return state.players.map(function(_, i){
      return HOLES[state.holeIdx].par;
    });
  }
  function ensureHoleScores(idx){
    if(!state.scores[idx]){
      state.scores[idx] = state.players.map(function(){ return HOLES[idx].par; });
    }
  }
  function totalFor(playerIdx){
    var t = 0;
    for(var h=0; h<HOLES.length; h++){
      if(state.scores[h] && typeof state.scores[h][playerIdx] === "number"){
        t += state.scores[h][playerIdx];
      }
    }
    return t;
  }
  function parTotal(){
    return HOLES.reduce(function(s,h){ return s+h.par; }, 0);
  }

  // ---------- SETUP screen ----------
  var elPlayerList = document.getElementById("player-list");
  var elAddPlayer = document.getElementById("btn-add-player");
  var elStart = document.getElementById("btn-start");

  function renderSetup(){
    elPlayerList.innerHTML = "";
    state.players.forEach(function(name, i){
      var row = document.createElement("div");
      row.className = "player-row";

      var input = document.createElement("input");
      input.type = "text";
      input.placeholder = "Player " + (i+1);
      input.value = name;
      input.maxLength = 20;
      input.addEventListener("input", function(){
        state.players[i] = input.value;
        updateStartButton();
        save();
      });
      row.appendChild(input);

      if(state.players.length > 1){
        var rm = document.createElement("button");
        rm.className = "rm";
        rm.type = "button";
        rm.textContent = "×";
        rm.addEventListener("click", function(){
          state.players.splice(i,1);
          renderSetup();
          save();
        });
        row.appendChild(rm);
      }
      elPlayerList.appendChild(row);
    });
    elAddPlayer.disabled = state.players.length >= 10;
    updateStartButton();
  }

  function updateStartButton(){
    var filled = state.players.filter(function(n){ return n.trim().length>0; }).length;
    elStart.disabled = filled < 1;
  }

  elAddPlayer.addEventListener("click", function(){
    if(state.players.length < 10){
      state.players.push("");
      renderSetup();
    }
  });

  elStart.addEventListener("click", function(){
    state.players = state.players
      .map(function(n){ return n.trim(); })
      .filter(function(n){ return n.length>0; });
    if(state.players.length === 0) return;
    state.scores = [];
    state.holeIdx = 0;
    ensureHoleScores(0);
    state.stage = "play";
    save();
    render();
  });

  // ---------- PLAY screen ----------
  var elHoleNum = document.getElementById("hole-number");
  var elHolePar = document.getElementById("hole-par");
  var elHoleDist = document.getElementById("hole-dist");
  var elProgress = document.getElementById("hole-progress");
  var elScoreRows = document.getElementById("score-rows");
  var elPrev = document.getElementById("btn-prev");
  var elNext = document.getElementById("btn-next");
  var elAbandon = document.getElementById("btn-abandon");
  var elToggleFull = document.getElementById("btn-toggle-full");
  var elFullCard = document.getElementById("full-card");
  var elFullTable = document.getElementById("full-table");

  function renderPlay(){
    var idx = state.holeIdx;
    var hole = HOLES[idx];
    ensureHoleScores(idx);

    elHoleNum.innerHTML = hole.n + "<sup>/18</sup>";
    elHolePar.textContent = "PAR " + hole.par;
    elHoleDist.textContent = hole.d + " m";

    elProgress.innerHTML = "";
    HOLES.forEach(function(h, i){
      var t = document.createElement("div");
      t.className = "tick" + (i < idx ? " done" : "") + (i === idx ? " current" : "");
      elProgress.appendChild(t);
    });

    elScoreRows.innerHTML = "";
    state.players.forEach(function(name, pi){
      var row = document.createElement("div");
      row.className = "score-row";

      var nm = document.createElement("div");
      nm.className = "pname";
      nm.textContent = name;
      row.appendChild(nm);

      var stepper = document.createElement("div");
      stepper.className = "stepper";

      var minus = document.createElement("button");
      minus.type = "button";
      minus.textContent = "–";
      minus.addEventListener("click", function(){
        var v = state.scores[idx][pi];
        if(v > 1){ state.scores[idx][pi] = v - 1; renderPlay(); save(); }
      });

      var val = document.createElement("div");
      val.className = "val";
      val.textContent = state.scores[idx][pi];

      var plus = document.createElement("button");
      plus.type = "button";
      plus.textContent = "+";
      plus.addEventListener("click", function(){
        state.scores[idx][pi] = state.scores[idx][pi] + 1;
        renderPlay(); save();
      });

      stepper.appendChild(minus);
      stepper.appendChild(val);
      stepper.appendChild(plus);
      row.appendChild(stepper);
      elScoreRows.appendChild(row);
    });

    elPrev.disabled = false;
    elPrev.style.visibility = idx === 0 ? "hidden" : "visible";
    elNext.textContent = idx === HOLES.length - 1 ? "Finish round" : "Next hole";
    elNext.className = idx === HOLES.length - 1 ? "finish" : "next";

    renderFullTable(elFullTable, false);
  }

  elPrev.addEventListener("click", function(){
    if(state.holeIdx > 0){
      state.holeIdx -= 1;
      save();
      renderPlay();
    }
  });

  elNext.addEventListener("click", function(){
    if(state.holeIdx < HOLES.length - 1){
      state.holeIdx += 1;
      ensureHoleScores(state.holeIdx);
      save();
      renderPlay();
    } else {
      state.stage = "results";
      save();
      render();
    }
  });

  elToggleFull.addEventListener("click", function(){
    var showing = elFullCard.style.display !== "none";
    elFullCard.style.display = showing ? "none" : "block";
    elToggleFull.textContent = showing ? "View full scorecard" : "Hide full scorecard";
  });

  armConfirm(elAbandon, "End & reset round", "Tap again to confirm", resetRound);

  function renderFullTable(tableEl, forResults){
    var html = "<tr><th class='pname'>Hole</th>";
    HOLES.forEach(function(h){ html += "<th>" + h.n + "</th>"; });
    html += "<th>Tot</th></tr>";

    html += "<tr class='par-tr'><td class='pname'>Par</td>";
    HOLES.forEach(function(h){ html += "<td>" + h.par + "</td>"; });
    html += "<td>" + parTotal() + "</td></tr>";

    state.players.forEach(function(name, pi){
      html += "<tr><td class='pname'>" + escapeHtml(name) + "</td>";
      HOLES.forEach(function(h, hi){
        var v = (state.scores[hi] && typeof state.scores[hi][pi]==="number") ? state.scores[hi][pi] : "–";
        html += "<td>" + v + "</td>";
      });
      html += "<td><strong>" + totalFor(pi) + "</strong></td></tr>";
    });

    tableEl.innerHTML = html;
  }

  function escapeHtml(s){
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- RESULTS screen ----------
  var elPodium = document.getElementById("podium");
  var elResultsFullBtn = document.getElementById("btn-results-full");
  var elResultsFullCard = document.getElementById("results-full-card");
  var elResultsTable = document.getElementById("results-table");
  var elNewRound = document.getElementById("btn-new-round");

  function renderResults(){
    var par = parTotal();
    var ranked = state.players.map(function(name, pi){
      var total = totalFor(pi);
      return { name: name, total: total, diff: total - par };
    }).sort(function(a,b){ return a.total - b.total; });

    elPodium.innerHTML = "";
    ranked.forEach(function(r, i){
      var row = document.createElement("div");
      row.className = "place" + (i===0 ? " first" : "");

      var rank = document.createElement("div");
      rank.className = "rank";
      rank.textContent = (i+1) + (i===0 ? " \u{1F3C6}" : "");
      row.appendChild(rank);

      var nm = document.createElement("div");
      nm.className = "pname";
      nm.textContent = r.name;
      row.appendChild(nm);

      var tot = document.createElement("div");
      tot.className = "total";
      tot.textContent = r.total;
      row.appendChild(tot);

      var topar = document.createElement("div");
      var label = r.diff === 0 ? "E" : (r.diff > 0 ? "+"+r.diff : String(r.diff));
      var cls = r.diff === 0 ? "even" : (r.diff > 0 ? "over" : "under");
      topar.className = "topar " + cls;
      topar.textContent = label;
      row.appendChild(topar);

      elPodium.appendChild(row);
    });

    renderFullTable(elResultsTable, true);
  }

  elResultsFullBtn.addEventListener("click", function(){
    var showing = elResultsFullCard.style.display !== "none";
    elResultsFullCard.style.display = showing ? "none" : "block";
    elResultsFullBtn.textContent = showing ? "View full scorecard" : "Hide full scorecard";
  });

  armConfirm(elNewRound, "New round", "Tap again to confirm", resetRound);

  function armConfirm(btn, restLabel, confirmLabel, action){
    var armed = false;
    var timer = null;
    btn.addEventListener("click", function(){
      if(!armed){
        armed = true;
        btn.textContent = confirmLabel;
        btn.classList.add("armed");
        timer = setTimeout(function(){
          armed = false;
          btn.textContent = restLabel;
          btn.classList.remove("armed");
        }, 3000);
      } else {
        clearTimeout(timer);
        armed = false;
        btn.textContent = restLabel;
        btn.classList.remove("armed");
        action();
      }
    });
  }

  function resetRound(){
    state = { stage:"setup", players:["",""], scores:[], holeIdx:0 };
    save();
    render();
  }

  // ---------- TABS ----------
  var tabScore = document.getElementById("tab-score");
  var tabMap = document.getElementById("tab-map");
  var screenMap = document.getElementById("screen-map");
  var activeTab = "score";

  tabScore.addEventListener("click", function(){
    activeTab = "score";
    tabScore.classList.add("active");
    tabMap.classList.remove("active");
    render();
  });
  tabMap.addEventListener("click", function(){
    activeTab = "map";
    tabMap.classList.add("active");
    tabScore.classList.remove("active");
    render();
  });

  var mapWrap = document.getElementById("map-wrap");

  // ---------- MASTER RENDER ----------
  var screens = {
    setup: document.getElementById("screen-setup"),
    play: document.getElementById("screen-play"),
    results: document.getElementById("screen-results"),
    map: screenMap
  };

  var mainEl = document.querySelector("main");

  function render(){
    Object.keys(screens).forEach(function(k){ screens[k].classList.remove("active"); });

    if(activeTab === "map"){
      mainEl.classList.add("map-mode");
      screens.map.classList.add("active");
      return;
    }
    mainEl.classList.remove("map-mode");

    if(state.stage === "setup"){
      screens.setup.classList.add("active");
      renderSetup();
    } else if(state.stage === "play"){
      screens.play.classList.add("active");
      renderPlay();
    } else {
      screens.results.classList.add("active");
      renderResults();
    }
  }

  // Warn before leaving/reloading whenever a round is actually in progress,
  // so an accidental refresh (pull gesture, back button, closed tab) shows a
  // native confirmation popup instead of silently wiping the scores.
  window.addEventListener("beforeunload", function(e){
    var inProgress = state.stage === "play" &&
      state.players.length > 0 &&
      (state.holeIdx > 0 || (state.scores[0] && state.scores[0].some(function(v, i){ return v !== HOLES[0].par; })));
    if(inProgress){
      e.preventDefault();
      e.returnValue = "";
      return "";
    }
  });

  load();
  render();

  // Fallback pull-to-refresh guard for browsers that ignore overscroll-behavior.
  // Only blocks the specific gesture (finger dragging down while already at
  // the very top of the page) — normal scrolling and pinch-zoom on the map
  // still work fine.
  var touchStartY = 0;
  document.addEventListener("touchstart", function(e){
    touchStartY = e.touches[0].clientY;
  }, { passive:true });
  document.addEventListener("touchmove", function(e){
    var touchY = e.touches[0].clientY;
    var scroller = e.target.closest(".map-wrap, main");
    var atTop = !scroller || scroller.scrollTop <= 0;
    var pullingDown = touchY - touchStartY > 0;
    if(atTop && pullingDown && (!scroller || scroller.scrollTop === 0)){
      e.preventDefault();
    }
  }, { passive:false });
})();
</script>
</body>
</html>
